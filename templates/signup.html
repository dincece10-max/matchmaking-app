<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Dealflow Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 py-10">

<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-slate-100">
    <h2 class="text-2xl font-bold text-slate-800 mb-4">Create Your Account</h2>
    {% if error %}
        <p class="text-red-500 mb-4 text-sm">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label class="block text-sm font-semibold text-slate-700 mb-1">I am registering as:</label>
        <select name="role" id="roleSelect" onchange="toggleRoleFields()" required class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">
            <option value="investor">Investor / Angel</option>
            <option value="founder">Startup Founder</option>
        </select>

        <label class="block text-sm font-semibold text-slate-700 mb-1">Full Name</label>
        <input type="text" name="name" required placeholder="Jane Doe" class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

        <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="jane@venturecap.com" class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

        <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

        <div id="investorFields">
            <label class="block text-sm font-semibold text-slate-700 mb-1">Firm / Fund Name (Optional)</label>
            <input type="text" name="firm_name" placeholder="Acme Capital" class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">
        </div>

        <div id="founderFields" class="hidden">
            <hr class="my-4 border-slate-200">
            <h3 class="text-lg font-bold text-slate-800 mb-3">Startup Details</h3>
            
            <label class="block text-sm font-semibold text-slate-700 mb-1">Company Name</label>
            <input type="text" name="company_name" placeholder="Alpha AI" class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

            <label class="block text-sm font-semibold text-slate-700 mb-1">Category / Sector</label>
            <input type="text" name="category" placeholder="Fintech, SaaS, HealthTech" class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

            <label class="block text-sm font-semibold text-slate-700 mb-1">Funding Stage Seeking</label>
            <input type="text" name="funding_stage" placeholder="Pre-Seed ($250k)" class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

            <label class="block text-sm font-semibold text-slate-700 mb-1">Pitch Deck Link (DocSend, Google Drive, or PDF URL)</label>
            <input type="url" name="pitch_deck_url" placeholder="https://docsend.com/view/..." class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm">

            <label class="block text-sm font-semibold text-slate-700 mb-1">Short Description / Pitch</label>
            <textarea name="description" rows="3" placeholder="Brief elevator pitch..." class="w-full p-2.5 mb-4 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition">Sign Up</button>
    </form>
    <p class="text-center text-sm text-slate-600 mt-4">Already have an account? <a href="/login" class="text-indigo-600 font-semibold hover:underline">Log In</a></p>
</div>

<script>
function toggleRoleFields() {
    const role = document.getElementById('roleSelect').value;
    document.getElementById('founderFields').style.display = role === 'founder' ? 'block' : 'none';
    document.getElementById('investorFields').style.display = role === 'investor' ? 'block' : 'none';
}
</script>

</body>
</html>
